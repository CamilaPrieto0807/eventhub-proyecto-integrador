<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Event<span>Hub</span></a>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="eventos.html">Eventos</a>
        <a href="categorias.html">Categorías</a>
        <a href="como-funciona.html">Cómo funciona</a>
        <a href="login.html" class="btn btn-ghost">Ingresar</a>
        <a href="registro.html" class="btn btn-primary is-current" aria-current="page">Regístrate</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-wrap">
      <div class="container">
        <form class="auth-card" id="registroForm">
          <p class="eyebrow">Nueva cuenta</p>
          <h1>Regístrate</h1>
          <p class="page-lead">Crea tu cuenta para comprar entradas o gestionar eventos.</p>

          <div class="field">
            <label for="registroNombre">Nombre completo</label>
            <input type="text" id="registroNombre" name="nombre" autocomplete="name" required minlength="3" placeholder="Tu nombre">
          </div>

          <div class="field">
            <label for="registroEmail">Correo electrónico</label>
            <input type="email" id="registroEmail" name="email" autocomplete="email" required placeholder="tu@correo.com">
          </div>

          <div class="field">
            <label for="registroTipo">Tipo de cuenta</label>
            <select id="registroTipo" name="tipo" required>
              <option value="cliente">Cliente</option>
              <option value="agente">Agente</option>
            </select>
          </div>

          <div class="field">
            <label for="registroPass">Contraseña</label>
            <input type="password" id="registroPass" name="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="Mínimo 8 caracteres">
          </div>

          <div class="field">
            <label for="registroPass2">Confirmar contraseña</label>
            <input type="password" id="registroPass2" name="password2" autocomplete="new-password" required minlength="8" maxlength="72" data-match="#registroPass" placeholder="Repite la contraseña">
          </div>

          <button type="submit" class="btn btn-primary">Crear cuenta</button>
          <p class="form-feedback" role="status" hidden></p>
          <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Ingresar</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="logo">Event<span>Hub</span></a>
        <p class="footer-copy">© 2026 EventHub — Proyecto Integrador. Todos los derechos reservados.</p>
      </div>
      <nav class="footer-social" aria-label="Redes sociales">
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M14.5 8.5V6.8c0-.8.6-1.3 1.4-1.3H17V3h-2.2C12.2 3 11 4.6 11 6.7v1.8H9V11h2v10h3.5V11h2.4l.4-2.5h-2.8z"></path>
          </svg>
        </a>
        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M22 12.2s0-3.2-.4-4.6c-.2-.9-.9-1.6-1.8-1.8C18.2 5.4 12 5.4 12 5.4s-6.2 0-7.8.4c-.9.2-1.6.9-1.8 1.8C2 9 2 12.2 2 12.2s0 3.2.4 4.6c.2.9.9 1.6 1.8 1.8 1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.4.4-4.6.4-4.6zM10 15.5v-6.6l5.2 3.3L10 15.5z"></path>
          </svg>
        </a>
      </nav>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
