<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprar entradas — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Event<span>Hub</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <a href="eventos.html">Eventos</a>
        <a href="categorias.html">Categorías</a>
        <a href="login.html" class="btn btn-ghost">Ingresar</a>
        <a href="registro.html" class="btn btn-primary">Regístrate</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="auth-wrap">
      <div class="container">
        <form class="auth-card checkout-card" id="checkoutForm">
          <p class="eyebrow">Finaliza tu compra</p>
          <h1>Comprar entradas</h1>
          <h2 id="compraEvento"></h2>
          <p id="compraPrecio" class="evento-precio"></p>
          <p id="checkoutStock" class="event-stock"></p>
          <div class="field">
            <label for="cantidadEntradas">Cantidad (máximo 10 por compra)</label>
            <input type="number" id="cantidadEntradas" name="quantity" min="1" max="10" value="1" required>
          </div>
          <div class="field">
            <label for="tarjetaDemo">Número de tarjeta</label>
            <input type="text" id="tarjetaDemo" name="card" inputmode="numeric" autocomplete="off" pattern="[0-9]{16}" maxlength="16" required placeholder="16 dígitos">
          </div>
          <div class="checkout-fields">
            <div class="field">
              <label for="vencimientoDemo">Vencimiento (MM/AA)</label>
              <input type="text" id="vencimientoDemo" name="expiry" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" maxlength="5" required placeholder="MM/AA">
            </div>
            <div class="field">
              <label for="cvcDemo">CVC</label>
              <input type="password" id="cvcDemo" name="cvc" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" autocomplete="off" required placeholder="3 o 4 dígitos">
            </div>
          </div>
          <p class="checkout-total">Total: <strong id="compraTotal"></strong></p>
          <button type="submit" class="btn btn-primary">Pagar ahora</button>
          <p class="form-feedback" role="status" hidden></p>
          <p class="auth-switch"><a href="eventos.html">Volver a eventos</a></p>
        </form>
        <section class="auth-card" id="compraConfirmacion" hidden>
          <p class="eyebrow">Listo</p>
          <h1>Compra confirmada</h1>
          <p id="confirmacionTexto" class="page-lead"></p>
          <a class="btn btn-primary" id="ticketCompraLink" href="#">Ver y descargar mi ticket</a>
          <a class="btn btn-primary" href="perfil.html">Ver mis entradas</a>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="logo">Event<span>Hub</span></a>
        <p class="footer-copy">© 2026 EventHub — Proyecto Integrador. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
